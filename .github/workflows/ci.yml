name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  # real tofu init + validate on generated projects, and the fast-import
  # safety gate (hashicorp/local provider; no AWS credentials).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
      - run: make integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # install + run directly; the golangci-lint-action wrapper runs
      # `config verify`, which fetches a remote JSON schema and flakes on it.
      - name: install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.14.0/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
      - name: golangci-lint run
        run: "$(go env GOPATH)/bin/golangci-lint run --timeout 10m"
