name: release

# Manual only, on purpose: nothing publishes on a tag push or a merge to
# main. Trigger it by hand from the Actions tab when you're ready, review
# the result, and `gh release delete <tag> --cleanup-tag` if it's a stinker
# -- releases and their tag are fully redactable, nothing here is one-way.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: build (linux+darwin, amd64+arm64)
        env:
          VERSION: ${{ inputs.version }}
        run: make dist

      - name: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --generate-notes
