name: release

# Push a v* tag to release. A bad release is fully reversible:
# `gh release delete <tag> --cleanup-tag`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go test ./...

      - name: build (linux+darwin+windows, amd64+arm64)
        env:
          VERSION: ${{ github.ref_name }}
        run: make dist

      - name: create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --generate-notes
